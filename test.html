<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WORMS - Tests</title>
<style>
  body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
  h1 { color: #ff8a65; }
  .pass { color: #66bb6a; }
  .fail { color: #ef5350; font-weight: bold; }
  .section { margin-top: 16px; font-size: 14px; color: #ba68c8; font-weight: bold; }
  .result { margin-left: 16px; font-size: 13px; }
  #summary { margin-top: 24px; font-size: 16px; padding: 12px; border-radius: 8px; }
  #summary.all-pass { background: rgba(102,187,106,0.15); color: #66bb6a; }
  #summary.has-fail { background: rgba(239,83,80,0.15); color: #ef5350; }
</style>
</head>
<body>
<h1>WORMS Test Suite</h1>
<div id="output"></div>
<div id="summary"></div>

<canvas id="canvas" width="1200" height="1200" style="display:none;"></canvas>

<script>
// ========================================
// Extracted logic from index.html
// ========================================

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let rng;
function rand(a, b) {
  if (b === undefined) { b = a; a = 0; }
  return a + rng() * (b - a);
}
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
function chance(p) { return rng() < p; }

function adjustColor(color, amount) {
  if (!color || !color.startsWith('#')) return color || '#888';
  let r = parseInt(color.slice(1, 3), 16);
  let g = parseInt(color.slice(3, 5), 16);
  let b = parseInt(color.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
}
function darken(color, amount) { return adjustColor(color, -amount); }
function lighten(color, amount) { return adjustColor(color, amount); }

function computeTaper(t) {
  let taper = 1;
  if (t < 0.08) taper = 0.5 + (t / 0.08) * 0.5;
  if (t > 0.75) taper = 1 - ((t - 0.75) / 0.25) * 0.85;
  return Math.max(0.15, taper);
}

function sampleBezierPath(controlPoints, numSamples) {
  const result = [];
  const pts = controlPoints;
  const n = pts.length;
  for (let s = 0; s < numSamples; s++) {
    const t = s / (numSamples - 1);
    const total = n - 1;
    const segment = Math.min(Math.floor(t * total), total - 1);
    const localT = t * total - segment;
    const p0 = pts[Math.max(0, segment - 1)];
    const p1 = pts[segment];
    const p2 = pts[Math.min(n - 1, segment + 1)];
    const p3 = pts[Math.min(n - 1, segment + 2)];
    const tt = localT, tt2 = tt * tt, tt3 = tt2 * tt;
    const x = 0.5 * ((2*p1.x) + (-p0.x+p2.x)*tt + (2*p0.x-5*p1.x+4*p2.x-p3.x)*tt2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*tt3);
    const y = 0.5 * ((2*p1.y) + (-p0.y+p2.y)*tt + (2*p0.y-5*p1.y+4*p2.y-p3.y)*tt2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*tt3);
    result.push({ x, y });
  }
  return result;
}

function getAngleAt(pts, i) {
  let dx, dy;
  if (i === 0) { dx = pts[1].x - pts[0].x; dy = pts[1].y - pts[0].y; }
  else if (i >= pts.length - 1) { dx = pts[pts.length-1].x - pts[pts.length-2].x; dy = pts[pts.length-1].y - pts[pts.length-2].y; }
  else { dx = pts[i+1].x - pts[i-1].x; dy = pts[i+1].y - pts[i-1].y; }
  return Math.atan2(dy, dx);
}

const PALETTES = [
  { body: ['#e8719e','#f48fb1'], belly: '#f8c5d6', name: 'pink' },
  { body: ['#7cb342','#558b2f'], belly: '#c5e1a5', name: 'green' },
  { body: ['#8d6e63','#5d4037'], belly: '#d7ccc8', name: 'brown' },
];

const FIRST_NAMES = ['Sir','Lady','Professor','Captain'];
const LAST_NAMES = ['Wigglesworth','Squirmington','Crawlington','Slithers'];

// ========================================
// Test runner
// ========================================
let passed = 0, failed = 0;
const output = document.getElementById('output');

function section(name) {
  const el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  output.appendChild(el);
}

function assert(description, condition) {
  const el = document.createElement('div');
  el.className = 'result';
  if (condition) { el.innerHTML = '<span class="pass">✓</span> ' + description; passed++; }
  else { el.innerHTML = '<span class="fail">✗</span> ' + description; failed++; }
  output.appendChild(el);
}

// ========================================
// Tests
// ========================================

// --- Seeded RNG ---
section('Seeded RNG');

rng = mulberry32(42);
const seq1 = [rng(), rng(), rng()];
rng = mulberry32(42);
const seq2 = [rng(), rng(), rng()];
assert('Same seed produces same sequence', seq1[0] === seq2[0] && seq1[1] === seq2[1] && seq1[2] === seq2[2]);

rng = mulberry32(99);
const seq3 = [rng(), rng(), rng()];
assert('Different seed produces different sequence', seq1[0] !== seq3[0]);

rng = mulberry32(123);
assert('RNG output is in [0, 1)', (() => {
  for (let i = 0; i < 1000; i++) {
    const v = rng();
    if (v < 0 || v >= 1) return false;
  }
  return true;
})());

// --- rand / randInt / pick / chance ---
section('Random Utilities');

rng = mulberry32(7);
assert('rand(a, b) stays in range', (() => {
  for (let i = 0; i < 200; i++) {
    const v = rand(10, 20);
    if (v < 10 || v > 20) return false;
  }
  return true;
})());

rng = mulberry32(7);
assert('randInt(a, b) returns integers in range', (() => {
  for (let i = 0; i < 200; i++) {
    const v = randInt(1, 5);
    if (v < 1 || v > 5 || v !== Math.floor(v)) return false;
  }
  return true;
})());

rng = mulberry32(7);
const arr = ['a', 'b', 'c'];
assert('pick() returns element from array', (() => {
  for (let i = 0; i < 50; i++) {
    if (!arr.includes(pick(arr))) return false;
  }
  return true;
})());

rng = mulberry32(7);
assert('chance(0) always false, chance(1) always true', (() => {
  for (let i = 0; i < 50; i++) {
    if (chance(0)) return false;
  }
  rng = mulberry32(7);
  for (let i = 0; i < 50; i++) {
    if (!chance(1)) return false;
  }
  return true;
})());

// --- Color utilities ---
section('Color Utilities');

assert('darken reduces channel values', darken('#804020', 16) === '#702010');
assert('lighten increases channel values', lighten('#804020', 16) === '#905030');
assert('darken clamps at 0', darken('#050505', 20) === '#000000');
assert('lighten clamps at 255', lighten('#fafafa', 20) === '#ffffff');
assert('adjustColor handles non-hex gracefully', adjustColor('rgb(1,2,3)', 10) === 'rgb(1,2,3)');
assert('adjustColor handles null', adjustColor(null, 10) === '#888');

// --- computeTaper ---
section('Body Taper');

assert('Taper at t=0 is 0.5 (head tip)', computeTaper(0) === 0.5);
assert('Taper at t=0.08 is 1.0 (full width)', computeTaper(0.08) === 1);
assert('Taper at t=0.5 is 1.0 (mid body)', computeTaper(0.5) === 1);
assert('Taper at t=1.0 is tapered (tail)', computeTaper(1) === 0.15);
assert('Taper is always >= 0.15', (() => {
  for (let t = 0; t <= 1; t += 0.01) {
    if (computeTaper(t) < 0.15 - 0.001) return false;
  }
  return true;
})());
assert('Taper is always <= 1.0', (() => {
  for (let t = 0; t <= 1; t += 0.01) {
    if (computeTaper(t) > 1.001) return false;
  }
  return true;
})());

// --- Bezier path sampling ---
section('Bezier Path Sampling');

const controlPts = [
  { x: 100, y: 300 },
  { x: 300, y: 200 },
  { x: 500, y: 400 },
  { x: 700, y: 300 }
];

const sampled = sampleBezierPath(controlPts, 100);

assert('Returns requested number of samples', sampled.length === 100);

assert('First sample near first control point', (() => {
  const dx = sampled[0].x - controlPts[0].x;
  const dy = sampled[0].y - controlPts[0].y;
  return Math.sqrt(dx*dx + dy*dy) < 5;
})());

assert('Last sample near last control point', (() => {
  const last = sampled[sampled.length - 1];
  const cp = controlPts[controlPts.length - 1];
  const dx = last.x - cp.x;
  const dy = last.y - cp.y;
  return Math.sqrt(dx*dx + dy*dy) < 5;
})());

assert('All samples have finite coordinates', sampled.every(p => isFinite(p.x) && isFinite(p.y)));

assert('Path is continuous (no jumps > 20px between adjacent samples)', (() => {
  for (let i = 1; i < sampled.length; i++) {
    const dx = sampled[i].x - sampled[i-1].x;
    const dy = sampled[i].y - sampled[i-1].y;
    if (Math.sqrt(dx*dx + dy*dy) > 20) return false;
  }
  return true;
})());

// --- getAngleAt ---
section('Angle Computation');

const straightPts = [{x:0,y:0},{x:10,y:0},{x:20,y:0},{x:30,y:0}];
assert('Horizontal path gives angle ~0', Math.abs(getAngleAt(straightPts, 1)) < 0.01);

const upPts = [{x:0,y:0},{x:0,y:-10},{x:0,y:-20},{x:0,y:-30}];
assert('Upward path gives angle ~-π/2', Math.abs(getAngleAt(upPts, 1) - (-Math.PI/2)) < 0.01);

assert('getAngleAt handles first index', isFinite(getAngleAt(straightPts, 0)));
assert('getAngleAt handles last index', isFinite(getAngleAt(straightPts, straightPts.length - 1)));

// --- Name generation ---
section('Name Generation');

rng = mulberry32(42);
assert('generateName returns two words', (() => {
  function generateName() { return pick(FIRST_NAMES) + ' ' + pick(LAST_NAMES); }
  const name = generateName();
  return name.split(' ').length === 2;
})());

// --- Integration: full generation doesn't throw ---
section('Integration');

assert('Full worm generation completes without error', (() => {
  try {
    rng = mulberry32(12345);
    const bodyCtrl = [];
    const numPts = randInt(4, 6);
    const SIZE = 1200;
    const groundY = SIZE * rand(0.55, 0.68);
    const startX = SIZE * rand(0.12, 0.25);
    const endX = SIZE * rand(0.75, 0.88);
    bodyCtrl.push({ x: startX, y: groundY + rand(-30, 30) });
    for (let i = 1; i < numPts - 1; i++) {
      const t = i / (numPts - 1);
      bodyCtrl.push({ x: startX + (endX-startX)*t + rand(-40,40), y: groundY - Math.sin(t*Math.PI*rand(1,2.5))*rand(40,150) + rand(-30,30) });
    }
    bodyCtrl.push({ x: endX, y: groundY + rand(-20, 20) });
    const path = sampleBezierPath(bodyCtrl, 200);
    if (path.length !== 200) return false;
    if (!path.every(p => isFinite(p.x) && isFinite(p.y))) return false;
    // Verify taper works for full path
    for (let i = 0; i < path.length; i++) {
      const t = i / (path.length - 1);
      if (!isFinite(computeTaper(t))) return false;
    }
    return true;
  } catch(e) {
    return false;
  }
})());

assert('Multiple seeds produce different worms', (() => {
  const paths = [];
  for (let seed = 0; seed < 5; seed++) {
    rng = mulberry32(seed * 1000);
    const startX = rand(0.12, 0.25) * 1200;
    paths.push(startX);
  }
  // At least some should differ
  const unique = new Set(paths);
  return unique.size > 1;
})());

// ========================================
// Summary
// ========================================
const summaryEl = document.getElementById('summary');
const total = passed + failed;
summaryEl.textContent = passed + '/' + total + ' tests passed' + (failed > 0 ? ' — ' + failed + ' FAILED' : ' — all good!');
summaryEl.className = failed > 0 ? 'has-fail' : 'all-pass';
</script>
</body>
</html>
