<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORMS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f9f3ee; font-family: 'Helvetica Neue', Arial, sans-serif; color: #4a3728; padding: 20px;
  }
  h1 { font-size: clamp(32px,7vw,56px); font-weight: 900; letter-spacing: 6px; margin-bottom: 4px; color: #e8719e; }
  .subtitle { font-size: clamp(12px,2.5vw,16px); color: #baa48d; margin-bottom: 18px; font-style: italic; }
  .canvas-wrap {
    width: min(92vw, 560px); height: min(92vw, 560px);
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 6px 30px rgba(0,0,0,0.08); border: 3px solid #ecdfd2; background: #fff;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .worm-name { font-size: clamp(18px,4vw,28px); font-weight: 700; margin-top: 14px; color: #5a3e2b; letter-spacing: 1px; }
  .quote { font-size: clamp(14px,3vw,20px); font-style: italic; color: #8d6e63; margin-top: 4px; min-height: 1.5em; }
  .btn-row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 11px 26px; border: none; border-radius: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; color: #fff;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(0); }
  .btn-new { background: #e8719e; }
  .btn-save { background: #6aab73; }
  .footer { margin-top: 20px; font-size: 11px; color: #cbb9a6; font-style: italic; }
</style>
</head>
<body>
<h1>WORMS</h1>
<p class="subtitle">simple little guys, just for you</p>
<div class="canvas-wrap"><canvas id="canvas" width="1200" height="1200"></canvas></div>
<p class="worm-name" id="wormName"></p>
<p class="quote" id="wormQuote"></p>
<div class="btn-row">
  <button class="btn btn-new" id="btnNew">New Worm</button>
  <button class="btn btn-save" id="btnSave">Save PNG</button>
</div>
<p class="footer">every worm is one of a kind</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const S = 1200;

// --- RNG ---
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^(s>>>15),1|s);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296}}
let rng;
function rand(a,b){if(b===undefined){b=a;a=0}return a+rng()*(b-a)}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function pick(a){return a[Math.floor(rng()*a.length)]}
function chance(p){return rng()<p}

// --- Palettes ---
const PALS = [
  {body:'#e8927c', clit:'#c86040', name:'Shelby'}, // earthworm salmon
  {body:'#d46880', clit:'#b04465'},                  // rose worm
  {body:'#c4a870', clit:'#9c7c48'},                  // warm tan / sand
  {body:'#8cba5c', clit:'#629240'},                  // cartoon moss green
  {body:'#be8ccc', clit:'#9060aa'},                  // soft lavender
  {body:'#e89458', clit:'#c86c2c'},                  // burnt sienna orange
  {body:'#7cb898', clit:'#529070'},                  // muted sage teal
  {body:'#be7888', clit:'#965458'},                  // dusty mauve
  {body:'#a8b864', clit:'#7e9040'},                  // olive worm
  {body:'#cc7c5c', clit:'#a85438'},                  // terracotta
];

// --- Names ---
const FIRST=['Sir','Lady','Professor','Captain','Doctor','Baron','Duchess',
  'Little','Big','Tiny','Mighty','Gentle','Brave','Sleepy','Wiggly',
  'Squirmy','Curly','Slinky','Twisty','Muddy','Sunny','Dewy','Misty',
  'Lord','Princess','Duke','Baby','Sweet','Grumpy','Fancy','Jolly','Dizzy',
  'Sparkly','Soggy','Fluffy','Spicy','Tangy','Snoozy','Cozy','Dapper','Shelby'];
const LAST=['Wigglesworth','Squirmington','Crawlington','Slithers','Tunnelby',
  'Dirtsworth','Loamley','Humus','Compost','Nightcrawler',
  'Dewdrop','Pebblesnoot','Leafwhisper','Rootsworth','Mossbottom',
  'Noodlebody','Stringbean','Tubenstein','Squishface','Wrigglebutt',
  'Doodlebug','Snugglepile','Blobkins','Wobblekins',
  'Pudgeworth','Squooshle','Bumblebean','Dimpleton','Gigglesnort'];

const QUOTES = [
  "Check please!", "Mm-hmm!", "I'm a worm!", "Wiggle wiggle!", "Check... PLEASE!",
  "Puh-lease.", "I'm kind of a big deal.", "I live in a viola!", "Worms rule.",
  "Dig it.", "Slippery!", "I'm pink!", "Soil is tasty."
];

function generateWorm() {
  const cx = S / 2, cy = S / 2;
  let pts = [];
  const numSegs = 85;

  const sitting = chance(0.6); // moderate skew toward sitting upright

  let x, y, angle;
  if (sitting) {
    // Head high, body flows downward — worm "sitting" and looking at you
    x = cx + rand(-70, 70);
    y = cy - rand(220, 320);
    angle = Math.PI / 2 + rand(-0.5, 0.5); // mostly downward, slight lean
  } else {
    // Classic meandering pose
    x = cx + rand(-50, 50);
    y = cy - rand(100, 200);
    angle = rand(Math.PI * 1.3, Math.PI * 1.7);
  }

  let stepLen = rand(9, 14);
  // Sitting worms: looser curves so the body drapes/meanders rather than coiling tight
  let curvature = sitting ? rand(0.04, 0.10) : rand(0.05, 0.15);
  let squiggleAmp = sitting ? rand(0.08, 0.20) : rand(0.1, 0.3);
  let squiggleFreq = rand(0.1, 0.2);

  let currentCurvature = (chance(0.5) ? 1 : -1) * curvature;

  for (let i = 0; i < numSegs; i++) {
    pts.push({ x, y });

    let wiggle = Math.sin(i * squiggleFreq) * squiggleAmp;
    let jitter = rand(-0.08, 0.08);

    // Gravity pulls tail down
    let gravity = 0.07;
    let targetAngle = Math.PI / 2;

    angle += wiggle + jitter + currentCurvature;
    angle = angle * (1 - gravity) + targetAngle * gravity;

    if (chance(sitting ? 0.07 : 0.1)) currentCurvature = (chance(0.5) ? 1 : -1) * curvature;

    x += Math.cos(angle) * stepLen;
    y += Math.sin(angle) * stepLen;
  }

  // Centering
  const xMin = Math.min(...pts.map(p => p.x));
  const xMax = Math.max(...pts.map(p => p.x));
  const yMin = Math.min(...pts.map(p => p.y));
  const yMax = Math.max(...pts.map(p => p.y));
  const ox = cx - (xMin + (xMax - xMin) / 2);
  // Sitting worms: anchor head near top of canvas rather than bbox-center
  const oy = sitting
    ? S * 0.18 - pts[0].y
    : cy - (yMin + (yMax - yMin) / 2);

  return pts.map(p => ({ x: p.x + ox, y: p.y + oy }));
}

function drawWormBody(pts, pal, headR, bodyR) {
  const n = pts.length;
  const clitStart = 0.08, clitEnd = 0.22;

  // Helper to get radius at point t
  const getR = (t) => {
    // Head is biggest at t=0, tapers to bodyR quickly, then stays bodyR
    if (t < 0.15) {
      // Smoothly interpolate from headR to bodyR in the first 15%
      const factor = t / 0.15;
      return headR * (1 - factor) + bodyR * factor;
    }
    return bodyR;
  };

  // 1. Shadow (draw once underneath)
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.05)';
  ctx.lineWidth = headR * 2 + 20;
  ctx.beginPath();
  ctx.moveTo(pts[0].x + 12, pts[0].y + 12);
  for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x + 12, pts[i].y + 12);
  ctx.stroke();
  ctx.restore();

  // 2. Bold Outer Silhouette
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111';
  for (let i = 0; i < n - 1; i++) {
    const t = i / (n - 1);
    const r = getR(t);
    const isClit = t > clitStart && t < clitEnd;
    const finalR = isClit ? r * 1.15 : r;
    ctx.lineWidth = finalR * 2 + 12;
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i+1].x, pts[i+1].y);
    ctx.stroke();
  }
  ctx.restore();

  // 3. Layered Body Rendering (Tail to Head) with LIGHT internal lines
  // We use a lighter version of the outline color for the individual circles
  const innerOutlineColor = 'rgba(0,0,0,0.15)'; 

  for (let i = n - 1; i >= 0; i--) {
    const t = i / (n - 1);
    const rBase = getR(t);
    const isClit = t > clitStart && t < clitEnd;
    const r = isClit ? rBase * 1.15 : rBase;
    const p = pts[i];

    // Inner segment "fold" line (lighter)
    ctx.fillStyle = innerOutlineColor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r + 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Fill circle
    ctx.fillStyle = isClit ? pal.clit : pal.body;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHeart(x, y, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.8);
  ctx.bezierCurveTo(x - r * 2, y + r * 0.4, x - r * 2, y - r, x - r * 0.7, y - r);
  ctx.bezierCurveTo(x - r * 0.2, y - r, x, y - r * 0.6, x, y - r * 0.3);
  ctx.bezierCurveTo(x, y - r * 0.6, x + r * 0.2, y - r, x + r * 0.7, y - r);
  ctx.bezierCurveTo(x + r * 2, y - r, x + r * 2, y + r * 0.4, x, y + r * 0.8);
  ctx.fill();
  ctx.restore();
}

function drawFace(head, headR, eyeStyle, mouthStyle, extras) {
  ctx.save();
  
  // Scale facial features to the Large Head
  const eyeSpread = headR * rand(0.38, 0.48);
  const eyeY = head.y - headR * rand(0.12, 0.22);
  const eyeR = headR * rand(0.16, 0.24);

  ctx.fillStyle = '#111';
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';

  for (let side = -1; side <= 1; side += 2) {
    const ex = head.x + side * eyeSpread;
    const ey = eyeY;

    if (eyeStyle === 'dot') {
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
    } else if (eyeStyle === 'heart') {
      drawHeart(ex, ey, eyeR * 1.5, '#111');
    } else if (eyeStyle === 'sparkle') {
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - eyeR*0.3, ey - eyeR*0.3, eyeR*0.4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + eyeR*0.4, ey + eyeR*0.4, eyeR*0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#111';
    } else if (eyeStyle === 'uwu') {
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.3, Math.PI + 0.2, -0.2); ctx.stroke();
    } else if (eyeStyle === 'wink' && side === 1) {
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.2, 0.5, Math.PI - 0.5); ctx.stroke();
    } else if (eyeStyle === 'wink' && side === -1) {
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
    } else if (eyeStyle === 'closed') {
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.2, 0.5, Math.PI - 0.5); ctx.stroke();
    }
  }

  // Bigger Mouth
  const mx = head.x, my = head.y + headR * rand(0.35, 0.5);
  const ms = headR * rand(0.3, 0.45);

  if (mouthStyle === 'smile') {
    ctx.beginPath(); ctx.arc(mx, my - ms*0.2, ms, 0.5, Math.PI - 0.5); ctx.stroke();
  } else if (mouthStyle === 'bigSmile') {
    ctx.beginPath(); ctx.arc(mx, my - ms*0.4, ms * 1.2, 0.3, Math.PI - 0.3); ctx.stroke();
  } else if (mouthStyle === 'o') {
    ctx.beginPath(); ctx.arc(mx, my, ms * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (mouthStyle === 'cat') {
    ctx.beginPath();
    ctx.arc(mx - ms*0.3, my, ms*0.3, 0, Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mx + ms*0.3, my, ms*0.3, 0, Math.PI);
    ctx.stroke();
  } else if (mouthStyle === 'blep') {
    ctx.beginPath(); ctx.arc(mx, my - ms*0.2, ms, 0.5, Math.PI - 0.5); ctx.stroke();
    ctx.fillStyle = '#ff7070';
    ctx.beginPath(); ctx.ellipse(mx + ms*0.3, my + ms*0.4, ms*0.3, ms*0.4, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.stroke();
  }

  // Blushing Variety
  if (extras.blush) {
    ctx.fillStyle = '#ff9ed4';
    ctx.globalAlpha = 0.5;
    if (extras.blushType === 'oval') {
      ctx.beginPath(); ctx.ellipse(head.x - eyeSpread * 1.6, eyeY + headR*0.3, eyeR*2, eyeR*1.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(head.x + eyeSpread * 1.6, eyeY + headR*0.3, eyeR*2, eyeR*1.2, 0, 0, Math.PI*2); ctx.fill();
    } else if (extras.blushType === 'dashes') {
      ctx.lineWidth = 3;
      for (let d = 0; d < 3; d++) {
        ctx.beginPath(); ctx.moveTo(head.x - eyeSpread*1.8 + d*8, eyeY + headR*0.2); ctx.lineTo(head.x - eyeSpread*1.8 + d*8 + 5, eyeY + headR*0.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(head.x + eyeSpread*1.4 + d*8, eyeY + headR*0.2); ctx.lineTo(head.x + eyeSpread*1.4 + d*8 + 5, eyeY + headR*0.4); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(head.x - eyeSpread * 1.6, eyeY + headR*0.3, eyeR*1.8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(head.x + eyeSpread * 1.6, eyeY + headR*0.3, eyeR*1.8, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function generate() {
  const seed = Date.now() ^ (Math.random() * 0xFFFFFFFF);
  rng = mulberry32(seed);
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, S, S);

  const pal = pick(PALS);
  const headThickness = rand(70, 95); // Current big head
  const bodyThickness = rand(45, 65); // Last time's slender body
  const pts = generateWorm();

  drawWormBody(pts, pal, headThickness, bodyThickness);
  
  const eyeStyle = pick(['dot','dot','heart','sparkle','uwu','wink','closed']);
  const mouthStyle = pick(['smile','smile','bigSmile','o','cat','blep']);
  const blush = chance(0.6);
  const blushType = pick(['circle', 'oval', 'dashes']);
  
  drawFace(pts[0], headThickness, eyeStyle, mouthStyle, { blush, blushType });

  const firstName = pick(FIRST);
  const fullName = firstName + ' ' + pick(LAST);
  document.getElementById('wormName').textContent = fullName;
  
  let quote = pick(QUOTES);
  if (pal.name === 'Shelby' || firstName === 'Shelby') {
    if (chance(0.6)) quote = "Check please!";
  }
  document.getElementById('wormQuote').textContent = `"${quote}"`;
}

generate();
document.getElementById('btnNew').addEventListener('click', generate);
document.getElementById('btnSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = document.getElementById('wormName').textContent.replace(/\s+/g,'_') + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
