<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORMS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f9f3ee; font-family: 'Georgia', serif; color: #4a3728; padding: 20px;
  }
  h1 { font-size: clamp(32px,7vw,56px); font-weight: 900; letter-spacing: 6px; margin-bottom: 4px; color: #e8719e; }
  .subtitle { font-size: clamp(12px,2.5vw,16px); color: #baa48d; margin-bottom: 18px; font-style: italic; }
  .canvas-wrap {
    width: min(92vw, 560px); height: min(92vw, 560px);
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 6px 30px rgba(0,0,0,0.08); border: 3px solid #ecdfd2; background: #fff;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .worm-name { font-size: clamp(18px,4vw,28px); font-weight: 700; margin-top: 14px; color: #5a3e2b; letter-spacing: 1px; }
  .btn-row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 11px 26px; border: none; border-radius: 14px;
    font-family: 'Georgia',serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; color: #fff;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(0); }
  .btn-new { background: #e8719e; }
  .btn-save { background: #6aab73; }
  .footer { margin-top: 20px; font-size: 11px; color: #cbb9a6; font-style: italic; }
</style>
</head>
<body>
<h1>WORMS</h1>
<p class="subtitle">a unique lil guy, just for you</p>
<div class="canvas-wrap"><canvas id="canvas" width="1200" height="1200"></canvas></div>
<p class="worm-name" id="wormName"></p>
<div class="btn-row">
  <button class="btn btn-new" id="btnNew">New Worm</button>
  <button class="btn btn-save" id="btnSave">Save PNG</button>
</div>
<p class="footer">every worm is one of a kind</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const S = 1200;

// --- RNG ---
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^(s>>>15),1|s);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296}}
let rng;
function rand(a,b){if(b===undefined){b=a;a=0}return a+rng()*(b-a)}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function pick(a){return a[Math.floor(rng()*a.length)]}
function chance(p){return rng()<p}

// --- Color helpers ---
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(c=>Math.max(0,Math.min(255,Math.round(c))).toString(16).padStart(2,'0')).join('')}
function adj(hex,n){const[r,g,b]=hexRgb(hex);return rgbHex(r+n,g+n,b+n)}

// --- Palettes ---
const PALS = [
  {body:'#e8719e',hi:'#f4a8c4',lo:'#c4547e',belly:'#f8d0df'},
  {body:'#7cb342',hi:'#a5d66a',lo:'#5a8a25',belly:'#d4edb8'},
  {body:'#f9a825',hi:'#fdd835',lo:'#c88a10',belly:'#fff3b0'},
  {body:'#ab47bc',hi:'#ce93d8',lo:'#7b1fa2',belly:'#e8c8ee'},
  {body:'#ff7043',hi:'#ff9a76',lo:'#d4482a',belly:'#ffd0c0'},
  {body:'#42a5f5',hi:'#80c8ff',lo:'#1a78c2',belly:'#bbdefb'},
  {body:'#ef5350',hi:'#ff8a80',lo:'#c62828',belly:'#ffcdd2'},
  {body:'#26a69a',hi:'#64d8cb',lo:'#00796b',belly:'#b2dfdb'},
  {body:'#8d6e63',hi:'#b59a8e',lo:'#5d4037',belly:'#d7ccc8'},
  {body:'#ffb74d',hi:'#ffe0a0',lo:'#e09530',belly:'#fff0d0'},
  {body:'#aed581',hi:'#d0eea0',lo:'#7da453',belly:'#e8f5c8'},
  {body:'#ba68c8',hi:'#d898e8',lo:'#883997',belly:'#e1bee7'},
  {body:'#e57373',hi:'#ffa4a2',lo:'#af4448',belly:'#fcc'},
  {body:'#78909c',hi:'#a7c0cd',lo:'#4b636e',belly:'#cfd8dc'},
];

// --- Names ---
const FIRST=['Sir','Lady','Professor','Captain','Doctor','Baron','Duchess',
  'Little','Big','Tiny','Mighty','Gentle','Brave','Sleepy','Wiggly',
  'Squirmy','Curly','Slinky','Twisty','Muddy','Sunny','Dewy','Misty',
  'Lord','Princess','Duke','Baby','Sweet','Grumpy','Fancy','Jolly','Dizzy',
  'Sparkly','Soggy','Fluffy','Spicy','Tangy','Snoozy','Cozy','Dapper'];
const LAST=['Wigglesworth','Squirmington','Crawlington','Slithers','Tunnelby',
  'Dirtsworth','Loamley','Humus','Compost','Nightcrawler',
  'Dewdrop','Pebblesnoot','Leafwhisper','Rootsworth','Mossbottom',
  'Noodlebody','Stringbean','Tubenstein','Squishface','Wrigglebutt',
  'Doodlebug','Snugglepile','Blobkins','Wobblekins','Goopsworth',
  'Pudgeworth','Squooshle','Bumblebean','Dimpleton','Gigglesnort'];

// ===================================================================
// WORM BODY — rounded, blobby, caterpillar-like
// The worm is: a big round head + a chain of round body blobs tapering to tail
// ===================================================================

function generateWorm() {
  const cx = S / 2, cy = S / 2;

  // Body curve: a smooth path for blob centers
  // Pick a random pose
  const pose = pick(['curl','wave','straight','arch','sShape','uBend','coil','stretch']);
  let pts = [];
  const numSegs = randInt(5, 9);

  switch(pose) {
    case 'straight': {
      const angle = rand(-0.5, 0.5);
      const len = rand(250, 450);
      const sx = cx - Math.cos(angle) * len * 0.5;
      const sy = cy - Math.sin(angle) * len * 0.5 + rand(-40, 40);
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        pts.push({ x: sx + Math.cos(angle) * len * t + rand(-15, 15), y: sy + Math.sin(angle) * len * t + rand(-10, 10) });
      }
      break;
    }
    case 'wave': {
      const baseY = cy + rand(-60, 60);
      const amp = rand(60, 150);
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        pts.push({ x: S * 0.18 + t * S * 0.64 + rand(-10, 10), y: baseY + Math.sin(t * Math.PI * rand(1.2, 2.5)) * amp });
      }
      break;
    }
    case 'curl': {
      const r = rand(100, 180);
      const turns = rand(0.8, 1.5);
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        const a = t * Math.PI * 2 * turns - Math.PI / 2;
        const cr = r * (1 - t * 0.3);
        pts.push({ x: cx + Math.cos(a) * cr + rand(-10, 10), y: cy + Math.sin(a) * cr * 0.8 + rand(-10, 10) });
      }
      break;
    }
    case 'arch': {
      const w = rand(200, 380);
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        pts.push({ x: cx - w/2 + t * w, y: cy + 80 - Math.sin(t * Math.PI) * rand(180, 320) });
      }
      break;
    }
    case 'sShape': {
      const h = rand(300, 480);
      const w = rand(80, 180);
      const flip = chance(0.5) ? 1 : -1;
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        pts.push({ x: cx + Math.sin(t * Math.PI * 2) * w * flip, y: cy + h/2 - t * h });
      }
      break;
    }
    case 'uBend': {
      const w = rand(160, 300);
      const depth = rand(150, 280);
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        pts.push({ x: cx - w/2 + t * w, y: cy - 60 + Math.sin(t * Math.PI) * depth });
      }
      break;
    }
    case 'coil': {
      const r = rand(80, 140);
      const turns = rand(1.3, 2.2);
      const nPts = Math.max(numSegs, 8);
      for (let i = 0; i < nPts; i++) {
        const t = i / (nPts - 1);
        const a = t * Math.PI * 2 * turns;
        pts.push({ x: cx + Math.cos(a) * r * (1 - t * 0.4), y: cy + Math.sin(a) * r * 0.7 * (1 - t * 0.3) });
      }
      break;
    }
    case 'stretch': {
      const angle = rand(-0.8, 0.8);
      const len = rand(350, 520);
      const sx = cx - Math.cos(angle) * len * 0.4;
      const sy = cy - Math.sin(angle) * len * 0.4;
      for (let i = 0; i < numSegs; i++) {
        const t = i / (numSegs - 1);
        pts.push({ x: sx + Math.cos(angle) * len * t, y: sy + Math.sin(angle) * len * t });
      }
      break;
    }
  }

  return pts;
}

// --- Draw the worm as a chain of round blobs ---
function drawWormBody(pts, pal, thickness, pattern) {
  // Head is pts[0], biggest. Each subsequent blob tapers slightly.
  const headR = thickness;
  const n = pts.length;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.1;
  ctx.fillStyle = '#4a3020';
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const r = blobRadius(t, headR);
    ctx.beginPath();
    ctx.arc(pts[i].x + 6, pts[i].y + 8, r + 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Body blobs back-to-front (draw tail first so head overlaps)
  for (let i = n - 1; i >= 0; i--) {
    const t = i / (n - 1);
    const r = blobRadius(t, headR);
    const p = pts[i];

    // Main fill — gradient per blob for roundness
    const g = ctx.createRadialGradient(p.x - r * 0.25, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
    g.addColorStop(0, pal.hi);
    g.addColorStop(0.6, pal.body);
    g.addColorStop(1, pal.lo);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Outline
    ctx.strokeStyle = pal.lo;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Belly highlight
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(p.x - r * 0.15, p.y - r * 0.2, r * 0.55, r * 0.4, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Pattern overlays (segments, spots, stripes)
  if (pattern === 'segments') {
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = pal.lo;
    ctx.lineWidth = 2;
    for (let i = 1; i < n; i++) {
      const t = i / (n - 1);
      const r = blobRadius(t, headR);
      // Ring near top of each blob
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, r * 0.85, -Math.PI * 0.7, -Math.PI * 0.3);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, r * 0.85, Math.PI * 0.3, Math.PI * 0.7);
      ctx.stroke();
    }
    ctx.restore();
  } else if (pattern === 'spots') {
    ctx.save();
    ctx.globalAlpha = 0.22;
    for (let i = 1; i < n; i++) {
      const t = i / (n - 1);
      const r = blobRadius(t, headR);
      const nSpots = randInt(1, 3);
      for (let s = 0; s < nSpots; s++) {
        const a = rand(0, Math.PI * 2);
        const d = rand(0, r * 0.5);
        const sr = rand(r * 0.12, r * 0.25);
        ctx.fillStyle = chance(0.5) ? pal.belly : adj(pal.lo, 15);
        ctx.beginPath();
        ctx.arc(pts[i].x + Math.cos(a) * d, pts[i].y + Math.sin(a) * d, sr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  } else if (pattern === 'stripes') {
    ctx.save();
    ctx.globalAlpha = 0.15;
    for (let i = 1; i < n; i++) {
      if (i % 2 === 0) continue;
      const t = i / (n - 1);
      const r = blobRadius(t, headR);
      ctx.fillStyle = pal.belly;
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, r * 0.92, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function blobRadius(t, headR) {
  // Head is biggest, body is slightly smaller, tapers to tail
  if (t < 0.01) return headR;
  if (t < 0.15) return headR * (0.85 + (1 - t / 0.15) * 0.15); // neck slightly narrower then head
  return headR * Math.max(0.3, 0.85 - (t - 0.15) * 0.65);
}

// --- Face (on the head blob, big cute cartoon face) ---
function drawFace(head, headR, pal, eyeStyle, mouthStyle, extras) {
  // Eyes are on the head, facing "forward" which we approximate as slightly up
  const eyeSpread = headR * rand(0.32, 0.45);
  const eyeY = head.y - headR * rand(0.05, 0.2);
  const eyeR = headR * rand(0.22, 0.32);

  for (let side = -1; side <= 1; side += 2) {
    const ex = head.x + side * eyeSpread;
    const ey = eyeY;

    if (eyeStyle === 'big') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
      const irisColor = pick(['#3d2b1f','#2a4a2a','#1a2a4a','#4a2a4a','#2a3a3a']);
      ctx.fillStyle = irisColor;
      ctx.beginPath(); ctx.arc(ex + eyeR * 0.1, ey + eyeR * 0.08, eyeR * 0.65, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(ex + eyeR * 0.15, ey + eyeR * 0.1, eyeR * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - eyeR * 0.2, ey - eyeR * 0.25, eyeR * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + eyeR * 0.2, ey + eyeR * 0.2, eyeR * 0.12, 0, Math.PI * 2); ctx.fill();
    } else if (eyeStyle === 'round') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#2a1a2e';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 0.45, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - eyeR * 0.15, ey - eyeR * 0.18, eyeR * 0.2, 0, Math.PI * 2); ctx.fill();
    } else if (eyeStyle === 'sleepy') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(ex, ey, eyeR * 1.1, eyeR * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#2a1a2e';
      ctx.beginPath(); ctx.arc(ex, ey + eyeR * 0.05, eyeR * 0.28, 0, Math.PI * 2); ctx.fill();
    } else if (eyeStyle === 'sparkle') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#2a1a2e';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 0.5, 0, Math.PI * 2); ctx.fill();
      // Star highlight
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      const sx = ex - eyeR * 0.25, sy = ey - eyeR * 0.3;
      for (let p = 0; p < 8; p++) {
        const pr = p % 2 === 0 ? eyeR * 0.3 : eyeR * 0.12;
        const pa = (p / 8) * Math.PI * 2 - Math.PI / 2;
        if (p===0) ctx.moveTo(sx+Math.cos(pa)*pr, sy+Math.sin(pa)*pr);
        else ctx.lineTo(sx+Math.cos(pa)*pr, sy+Math.sin(pa)*pr);
      }
      ctx.closePath(); ctx.fill();
    } else if (eyeStyle === 'dot') {
      ctx.fillStyle = '#2a1a2e';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - eyeR*0.1, ey - eyeR*0.12, eyeR*0.15, 0, Math.PI*2); ctx.fill();
    } else if (eyeStyle === 'wink' && side === 1) {
      ctx.strokeStyle = '#2a1a2e'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 0.6, 0.3, Math.PI - 0.3); ctx.stroke();
    } else if (eyeStyle === 'hearts') {
      drawHeart(ex, ey, eyeR, '#e74c3c');
    } else if (eyeStyle === 'uwu') {
      ctx.strokeStyle = '#2a1a2e'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey - eyeR*0.15, eyeR * 0.55, Math.PI + 0.3, -0.3); ctx.stroke();
    }

    // Fallback for wink non-wink side, and uwu
    if ((eyeStyle === 'wink' && side === -1)) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#2a1a2e';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR * 0.45, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - eyeR*0.15, ey - eyeR*0.18, eyeR*0.2, 0, Math.PI*2); ctx.fill();
    }
  }

  // Mouth
  const mx = head.x, my = head.y + headR * rand(0.2, 0.4);
  const ms = headR * 0.2;
  ctx.save();
  ctx.strokeStyle = '#4a2828'; ctx.fillStyle = '#4a2828';
  ctx.lineWidth = 2.5; ctx.lineCap = 'round';

  switch (mouthStyle) {
    case 'smile':
      ctx.beginPath(); ctx.arc(mx, my - ms*0.3, ms, 0.2, Math.PI - 0.2); ctx.stroke(); break;
    case 'bigSmile':
      ctx.beginPath(); ctx.arc(mx, my - ms*0.5, ms * 1.3, 0.3, Math.PI - 0.3); ctx.stroke();
      // Teeth
      ctx.fillStyle='#fff'; ctx.globalAlpha=0.5;
      ctx.beginPath(); ctx.arc(mx, my-ms*0.5, ms*0.8, 0.3, Math.PI-0.3); ctx.fill();
      ctx.globalAlpha=1; break;
    case 'open':
      ctx.fillStyle = '#4a2828';
      ctx.beginPath(); ctx.ellipse(mx, my, ms*0.5, ms*0.6, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e87070';
      ctx.beginPath(); ctx.ellipse(mx, my+ms*0.25, ms*0.3, ms*0.22, 0, 0, Math.PI); ctx.fill(); break;
    case 'blep':
      ctx.beginPath(); ctx.arc(mx, my-ms*0.2, ms*0.7, 0.2, Math.PI-0.2); ctx.stroke();
      ctx.fillStyle='#e87070';
      ctx.beginPath(); ctx.ellipse(mx+ms*0.1, my+ms*0.35, ms*0.2, ms*0.32, 0.1, 0, Math.PI*2); ctx.fill(); break;
    case 'tiny':
      ctx.beginPath(); ctx.arc(mx, my, ms*0.35, 0.2, Math.PI-0.2); ctx.stroke(); break;
    case 'o':
      ctx.fillStyle='#4a2828';
      ctx.beginPath(); ctx.arc(mx, my, ms*0.3, 0, Math.PI*2); ctx.fill(); break;
    case 'cat':
      // w-shaped cat mouth
      ctx.beginPath();
      ctx.moveTo(mx-ms*0.6, my-ms*0.1);
      ctx.lineTo(mx-ms*0.15, my+ms*0.3);
      ctx.lineTo(mx, my+ms*0.1);
      ctx.lineTo(mx+ms*0.15, my+ms*0.3);
      ctx.lineTo(mx+ms*0.6, my-ms*0.1);
      ctx.stroke(); break;
    case 'smirk':
      ctx.beginPath(); ctx.moveTo(mx-ms*0.4, my);
      ctx.quadraticCurveTo(mx, my+ms*0.5, mx+ms*0.5, my-ms*0.15); ctx.stroke(); break;
  }
  ctx.restore();

  // Rosy cheeks
  if (extras.rosyCheeks) {
    ctx.save(); ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#ff6b8a';
    ctx.beginPath(); ctx.ellipse(head.x - eyeSpread * 1.3, eyeY + headR*0.3, eyeR*0.7, eyeR*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(head.x + eyeSpread * 1.3, eyeY + headR*0.3, eyeR*0.7, eyeR*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawHeart(cx, cy, size, color) {
  ctx.save(); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.35);
  ctx.bezierCurveTo(cx-size*0.8, cy-size*0.15, cx-size*0.4, cy-size*0.8, cx, cy-size*0.3);
  ctx.bezierCurveTo(cx+size*0.4, cy-size*0.8, cx+size*0.8, cy-size*0.15, cx, cy+size*0.35);
  ctx.fill(); ctx.restore();
}

// ===================================================================
// SITUATIONS — the prop/scene the worm is in
// ===================================================================

function drawSituation(type, wormHead, wormPts, headR) {
  ctx.save();
  switch (type) {
    case 'apple': {
      // Big apple the worm is poking out of
      const ax = S/2 + rand(-60, 60), ay = S/2 + rand(80, 160), ar = rand(140, 200);
      ctx.fillStyle = pick(['#e74c3c','#27ae60','#f1c40f']);
      ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = adj(ctx.fillStyle, -30); ctx.lineWidth = 3; ctx.stroke();
      // Highlight
      ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(ax - ar*0.3, ay - ar*0.3, ar*0.4, ar*0.5, -0.4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      // Leaf
      ctx.fillStyle = '#4caf50';
      ctx.beginPath(); ctx.ellipse(ax + 10, ay - ar - 5, 25, 12, 0.4, 0, Math.PI*2); ctx.fill();
      // Stem
      ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ax, ay - ar + 5); ctx.lineTo(ax + 5, ay - ar - 15); ctx.stroke();
      // Bite hole (where worm comes from)
      ctx.fillStyle = '#f9f3ee';
      ctx.beginPath(); ctx.arc(ax + ar*0.5, ay - ar*0.3, headR*1.2, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'teacup': {
      const tx = S/2, ty = S/2 + 120;
      // Saucer
      ctx.fillStyle = '#e8ddd0';
      ctx.beginPath(); ctx.ellipse(tx, ty + 80, 200, 35, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c4b5a0'; ctx.lineWidth = 2; ctx.stroke();
      // Cup body
      ctx.fillStyle = pick(['#fff','#fce4ec','#e3f2fd','#fff9c4','#e8f5e9']);
      ctx.beginPath();
      ctx.moveTo(tx - 120, ty - 60); ctx.lineTo(tx - 100, ty + 60);
      ctx.quadraticCurveTo(tx, ty + 90, tx + 100, ty + 60);
      ctx.lineTo(tx + 120, ty - 60); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c4b5a0'; ctx.lineWidth = 2; ctx.stroke();
      // Rim
      ctx.beginPath(); ctx.ellipse(tx, ty - 60, 120, 20, 0, 0, Math.PI*2);
      ctx.fillStyle = adj(ctx.fillStyle, -8); ctx.fill();
      ctx.strokeStyle = '#c4b5a0'; ctx.stroke();
      // Handle
      ctx.strokeStyle = '#c4b5a0'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(tx + 135, ty, 30, -1.2, 1.2); ctx.stroke();
      // Cute pattern on cup
      ctx.save(); ctx.globalAlpha = 0.25;
      const patColor = pick(['#e91e63','#2196f3','#4caf50','#ff9800']);
      ctx.fillStyle = patColor;
      for (let i = 0; i < 5; i++) {
        const px = tx + rand(-80, 80), py = ty + rand(-30, 40);
        if (chance(0.5)) { drawHeart(px, py, 12, patColor); }
        else { ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill(); }
      }
      ctx.restore();
      break;
    }
    case 'mushroom': {
      const mx = S/2 + rand(-80, 80), my = S/2 + rand(60, 140);
      const mr = rand(130, 190);
      // Stem
      ctx.fillStyle = '#f5e6d3';
      ctx.beginPath();
      ctx.moveTo(mx - 40, my); ctx.lineTo(mx - 35, my + 100);
      ctx.quadraticCurveTo(mx, my + 115, mx + 35, my + 100);
      ctx.lineTo(mx + 40, my); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d4c0a0'; ctx.lineWidth = 2; ctx.stroke();
      // Cap
      const capColor = pick(['#e74c3c','#e91e63','#ff9800','#9c27b0','#4caf50']);
      ctx.fillStyle = capColor;
      ctx.beginPath(); ctx.ellipse(mx, my, mr, mr * 0.55, 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = adj(capColor, -30); ctx.lineWidth = 2.5; ctx.stroke();
      // Bottom rim
      ctx.fillStyle = '#f5e6d3';
      ctx.beginPath(); ctx.ellipse(mx, my, mr * 0.85, mr * 0.12, 0, 0, Math.PI); ctx.fill();
      // Spots
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7;
      for (let i = 0; i < randInt(3, 6); i++) {
        const sa = rand(-2.8, -0.3);
        const sd = rand(mr * 0.2, mr * 0.7);
        const sr = rand(10, 22);
        ctx.beginPath(); ctx.arc(mx + Math.cos(sa) * sd, my + Math.sin(sa) * sd * 0.55, sr, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'book': {
      const bx = S/2 + rand(-40, 40), by = S/2 + rand(60, 120);
      const bw = rand(200, 280), bh = rand(150, 200);
      // Open book pages
      ctx.fillStyle = '#fffef5';
      ctx.beginPath();
      ctx.moveTo(bx, by - 20);
      ctx.quadraticCurveTo(bx - bw*0.5, by - 30, bx - bw, by + 10);
      ctx.lineTo(bx - bw, by + bh); ctx.lineTo(bx, by + bh - 15);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d4c8b0'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx, by - 20);
      ctx.quadraticCurveTo(bx + bw*0.5, by - 30, bx + bw, by + 10);
      ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx, by + bh - 15);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Spine
      ctx.strokeStyle = '#c4b5a0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx, by - 20); ctx.lineTo(bx, by + bh - 15); ctx.stroke();
      // Text lines
      ctx.save(); ctx.globalAlpha = 0.15; ctx.strokeStyle = '#666';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const ly = by + 20 + i * 18;
        ctx.beginPath(); ctx.moveTo(bx - bw + 25, ly); ctx.lineTo(bx - 15, ly); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx + 15, ly); ctx.lineTo(bx + bw - 25, ly); ctx.stroke();
      }
      ctx.restore();
      break;
    }
    case 'flowerpot': {
      const fx = S/2 + rand(-50, 50), fy = S/2 + rand(100, 160);
      // Pot
      ctx.fillStyle = '#c0764a';
      ctx.beginPath();
      ctx.moveTo(fx - 80, fy - 20); ctx.lineTo(fx - 65, fy + 90);
      ctx.quadraticCurveTo(fx, fy + 100, fx + 65, fy + 90);
      ctx.lineTo(fx + 80, fy - 20); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#a0603a'; ctx.lineWidth = 2; ctx.stroke();
      // Rim
      ctx.fillStyle = '#d08555';
      ctx.beginPath(); ctx.ellipse(fx, fy - 20, 85, 15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      // Soil
      ctx.fillStyle = '#5d4037';
      ctx.beginPath(); ctx.ellipse(fx, fy - 18, 75, 12, 0, 0, Math.PI*2); ctx.fill();
      // Little flowers
      for (let i = 0; i < randInt(2, 4); i++) {
        const ffx = fx + rand(-50, 50), ffy = fy - rand(40, 100);
        ctx.strokeStyle = '#4a7a2e'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ffx, fy - 20); ctx.quadraticCurveTo(ffx + rand(-10,10), ffy + 20, ffx, ffy); ctx.stroke();
        const pc = pick(['#ff6b8a','#ffeb3b','#ff9800','#e1bee7','#81d4fa','#f48fb1']);
        ctx.fillStyle = pc;
        for (let p = 0; p < 5; p++) {
          const a = (p/5)*Math.PI*2;
          ctx.beginPath(); ctx.ellipse(ffx+Math.cos(a)*6, ffy+Math.sin(a)*6, 5, 3, a, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(ffx, ffy, 3, 0, Math.PI*2); ctx.fill();
      }
      break;
    }
    case 'rock': {
      // Cute round rock the worm peeks over/behind
      const rx = S/2 + rand(-60, 60), ry = S/2 + rand(80, 160);
      const rw = rand(140, 220), rh = rand(100, 150);
      ctx.fillStyle = pick(['#9e9e9e','#8d8d8d','#a1887f','#90a4ae']);
      ctx.beginPath(); ctx.ellipse(rx, ry, rw, rh, rand(-0.2, 0.2), 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = adj(ctx.fillStyle, -25); ctx.lineWidth = 2.5; ctx.stroke();
      // Highlight
      ctx.save(); ctx.globalAlpha = 0.12; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(rx - rw*0.2, ry - rh*0.3, rw*0.4, rh*0.35, -0.3, 0, Math.PI*2);
      ctx.fill(); ctx.restore();
      // Grass tufts around rock
      ctx.fillStyle = '#5a8a3c';
      for (let i = 0; i < 6; i++) {
        const gx = rx + rand(-rw, rw), gy = ry + rh * rand(0.5, 1);
        ctx.beginPath(); ctx.moveTo(gx-2, gy);
        ctx.quadraticCurveTo(gx+rand(-5,5), gy-rand(10,25), gx+1, gy); ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'jar': {
      const jx = S/2 + rand(-40, 40), jy = S/2 + rand(40, 100);
      // Glass jar
      ctx.fillStyle = 'rgba(200, 230, 255, 0.3)';
      ctx.strokeStyle = 'rgba(150, 190, 220, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(jx - 90, jy - 100);
      ctx.lineTo(jx - 85, jy + 120);
      ctx.quadraticCurveTo(jx, jy + 140, jx + 85, jy + 120);
      ctx.lineTo(jx + 90, jy - 100);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Rim
      ctx.fillStyle = '#d4a060';
      ctx.beginPath(); ctx.ellipse(jx, jy - 100, 95, 18, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#b08040'; ctx.lineWidth = 2; ctx.stroke();
      // Lid
      ctx.fillStyle = '#c09050';
      ctx.fillRect(jx - 100, jy - 125, 200, 28);
      ctx.beginPath(); ctx.ellipse(jx, jy - 125, 100, 12, 0, 0, Math.PI*2); ctx.fill();
      // Shine on glass
      ctx.save(); ctx.globalAlpha = 0.12; ctx.fillStyle = '#fff';
      ctx.fillRect(jx - 70, jy - 80, 15, 150);
      ctx.restore();
      break;
    }
    case 'none': break;
  }
  ctx.restore();
}

// ===================================================================
// ACCESSORIES (hats, jewelry, etc)
// ===================================================================

function drawHat(head, headR, type) {
  const topX = head.x, topY = head.y - headR * 0.85;
  ctx.save();

  switch (type) {
    case 'tophat': {
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.ellipse(topX, topY + 8, headR*0.9, headR*0.18, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(topX - headR*0.5, topY - headR*0.9, headR, headR);
      ctx.beginPath(); ctx.ellipse(topX, topY - headR*0.9, headR*0.5, headR*0.11, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = pick(['#c0392b','#f39c12','#2ecc71','#9b59b6']);
      ctx.fillRect(topX-headR*0.5, topY-headR*0.1, headR, headR*0.12);
      break;
    }
    case 'crown': {
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.moveTo(topX-headR*0.6, topY+8);
      ctx.lineTo(topX-headR*0.6, topY-headR*0.45);
      ctx.lineTo(topX-headR*0.3, topY-headR*0.2);
      ctx.lineTo(topX, topY-headR*0.55);
      ctx.lineTo(topX+headR*0.3, topY-headR*0.2);
      ctx.lineTo(topX+headR*0.6, topY-headR*0.45);
      ctx.lineTo(topX+headR*0.6, topY+8);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 2; ctx.stroke();
      // Jewels
      ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(topX, topY-headR*0.35, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2196f3';
      ctx.beginPath(); ctx.arc(topX-headR*0.35, topY-headR*0.22, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(topX+headR*0.35, topY-headR*0.22, 3, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'beret': {
      ctx.fillStyle = pick(['#c0392b','#2c3e50','#8e44ad','#16a085','#d35400']);
      ctx.beginPath(); ctx.ellipse(topX + headR*0.15, topY + 5, headR*0.7, headR*0.38, -0.15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(topX + headR*0.3, topY - headR*0.25, headR*0.08, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'partyHat': {
      const c1 = pick(['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6']);
      const c2 = pick(['#f1c40f','#fff','#e91e63','#00bcd4']);
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.moveTo(topX-headR*0.42, topY+8); ctx.lineTo(topX, topY-headR*1.1); ctx.lineTo(topX+headR*0.42, topY+8); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = c2; ctx.globalAlpha = 0.35;
      for (let i = 0; i < 5; i++) ctx.fillRect(topX-headR*0.5, topY-headR*1.1+i*headR*0.3, headR, headR*0.12);
      ctx.restore();
      ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(topX, topY-headR*1.1, headR*0.1, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'cowboyHat': {
      ctx.fillStyle = '#8B4513';
      ctx.beginPath(); ctx.ellipse(topX, topY+10, headR*1.1, headR*0.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(topX-headR*0.48, topY+8);
      ctx.lineTo(topX-headR*0.42, topY-headR*0.5);
      ctx.quadraticCurveTo(topX-headR*0.2, topY-headR*0.65, topX, topY-headR*0.55);
      ctx.quadraticCurveTo(topX+headR*0.2, topY-headR*0.65, topX+headR*0.42, topY-headR*0.5);
      ctx.lineTo(topX+headR*0.48, topY+8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#654321'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#d4a017';
      ctx.fillRect(topX-headR*0.44, topY-headR*0.12, headR*0.88, headR*0.08);
      break;
    }
    case 'wizardHat': {
      const wc = pick(['#2c3e50','#1a237e','#4a148c','#1b5e20']);
      ctx.fillStyle = wc;
      ctx.beginPath(); ctx.ellipse(topX, topY+8, headR*0.9, headR*0.18, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(topX-headR*0.48, topY+8);
      ctx.quadraticCurveTo(topX-headR*0.3, topY-headR*0.7, topX+headR*0.15, topY-headR*1.4);
      ctx.quadraticCurveTo(topX+headR*0.3, topY-headR*0.7, topX+headR*0.48, topY+8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd700'; ctx.globalAlpha = 0.6;
      for (let i = 0; i < 3; i++) {
        const sx = topX+rand(-headR*0.25, headR*0.25), sy = topY-rand(headR*0.2, headR*1.1);
        ctx.beginPath();
        for (let p = 0; p < 8; p++) {
          const pr = p%2===0 ? 6 : 2.5, pa = (p/8)*Math.PI*2-Math.PI/2;
          if(p===0)ctx.moveTo(sx+Math.cos(pa)*pr,sy+Math.sin(pa)*pr);
          else ctx.lineTo(sx+Math.cos(pa)*pr,sy+Math.sin(pa)*pr);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'beanie': {
      const bc = pick(['#e74c3c','#3498db','#2ecc71','#f39c12','#8e44ad','#e91e63']);
      ctx.fillStyle = bc;
      ctx.beginPath(); ctx.ellipse(topX, topY, headR*0.7, headR*0.45, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(topX-headR*0.7, topY-2, headR*1.4, headR*0.16);
      ctx.strokeStyle = adj(bc, -25); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(topX-headR*0.65, topY+headR*0.12); ctx.lineTo(topX+headR*0.65, topY+headR*0.12); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(topX, topY-headR*0.4, headR*0.14, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'bow': {
      const bc = pick(['#e74c3c','#e91e63','#9b59b6','#f39c12','#3498db','#ff6b8a']);
      ctx.fillStyle = bc;
      ctx.beginPath(); ctx.ellipse(topX-headR*0.35, topY+10, headR*0.35, headR*0.18, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(topX+headR*0.35, topY+10, headR*0.35, headR*0.18, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = adj(bc, -30);
      ctx.beginPath(); ctx.arc(topX, topY+10, headR*0.1, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'flower': {
      const pc = pick(['#ff6b8a','#ffeb3b','#ff9800','#e1bee7','#f48fb1','#81d4fa']);
      ctx.strokeStyle = '#4a7a2e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(topX, topY+10); ctx.lineTo(topX, topY-5); ctx.stroke();
      ctx.fillStyle = pc;
      for (let p = 0; p < 5; p++) {
        const a = (p/5)*Math.PI*2;
        ctx.beginPath(); ctx.ellipse(topX+Math.cos(a)*10, topY-5+Math.sin(a)*10, 9, 5, a, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(topX, topY-5, 5, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'tiara': {
      ctx.strokeStyle = '#c0c0c0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(topX-headR*0.6, topY+10);
      ctx.lineTo(topX-headR*0.35, topY-headR*0.15);
      ctx.lineTo(topX-headR*0.15, topY+5);
      ctx.lineTo(topX, topY-headR*0.3);
      ctx.lineTo(topX+headR*0.15, topY+5);
      ctx.lineTo(topX+headR*0.35, topY-headR*0.15);
      ctx.lineTo(topX+headR*0.6, topY+10);
      ctx.stroke();
      // Gems
      ctx.fillStyle = pick(['#e91e63','#00bcd4','#4caf50','#ff9800']);
      ctx.beginPath(); ctx.arc(topX, topY-headR*0.28, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(topX-1.5, topY-headR*0.28-1.5, 2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      break;
    }
  }
  ctx.restore();
}

function drawJewelry(head, headR, type) {
  ctx.save();
  switch (type) {
    case 'necklace': {
      const ny = head.y + headR * 0.75;
      const nColor = pick(['#f1c40f','#c0c0c0','#e91e63','#00bcd4']);
      ctx.strokeStyle = nColor; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(head.x, ny, headR * 0.5, 0.3, Math.PI - 0.3); ctx.stroke();
      // Pendant
      const pendType = pick(['gem','heart','star','circle']);
      const px = head.x, py = ny + headR * 0.48;
      if (pendType === 'gem') {
        ctx.fillStyle = pick(['#e74c3c','#2196f3','#4caf50','#9c27b0','#ff9800']);
        ctx.beginPath();
        ctx.moveTo(px, py + 12); ctx.lineTo(px - 8, py - 2); ctx.lineTo(px - 5, py - 8);
        ctx.lineTo(px + 5, py - 8); ctx.lineTo(px + 8, py - 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.moveTo(px, py-7); ctx.lineTo(px-4, py-2); ctx.lineTo(px+2, py-2); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (pendType === 'heart') {
        drawHeart(px, py, 10, pick(['#e74c3c','#e91e63','#f06292']));
      } else if (pendType === 'star') {
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i%2===0 ? 10 : 4.5, a = (i/10)*Math.PI*2 - Math.PI/2;
          if(i===0)ctx.moveTo(px+Math.cos(a)*r,py+Math.sin(a)*r);
          else ctx.lineTo(px+Math.cos(a)*r,py+Math.sin(a)*r);
        }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = pick(['#f1c40f','#c0c0c0']);
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill();
      }
      break;
    }
    case 'earring': {
      for (let side = -1; side <= 1; side += 2) {
        const ex = head.x + side * headR * 0.75, ey = head.y + headR * 0.15;
        const ec = pick(['#f1c40f','#c0c0c0','#e91e63']);
        ctx.fillStyle = ec;
        ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI*2); ctx.fill();
        // Dangle
        ctx.strokeStyle = ec; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(ex, ey+5); ctx.lineTo(ex, ey+15); ctx.stroke();
        const dangType = pick(['drop','circle','diamond']);
        if (dangType === 'drop') {
          ctx.fillStyle = pick(['#e74c3c','#2196f3','#4caf50','#ff9800']);
          ctx.beginPath(); ctx.arc(ex, ey+19, 4, 0, Math.PI*2); ctx.fill();
        } else if (dangType === 'diamond') {
          ctx.fillStyle = '#81d4fa';
          ctx.beginPath(); ctx.moveTo(ex, ey+12); ctx.lineTo(ex-4, ey+18); ctx.lineTo(ex, ey+24); ctx.lineTo(ex+4, ey+18); ctx.closePath(); ctx.fill();
        } else {
          ctx.strokeStyle = ec; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(ex, ey+20, 5, 0, Math.PI*2); ctx.stroke();
        }
      }
      break;
    }
    case 'glasses': {
      const gy = head.y - headR * rand(0.05, 0.15);
      const gSpread = headR * 0.35;
      const gr = headR * 0.28;
      const gColor = pick(['#333','#8B4513','#c0392b','#2980b9','#f39c12','#e91e63']);
      const gShape = pick(['round','square','cat']);
      ctx.strokeStyle = gColor; ctx.lineWidth = 3;
      for (let side = -1; side <= 1; side += 2) {
        const gx = head.x + side * gSpread;
        if (gShape === 'round') {
          ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI*2); ctx.stroke();
        } else if (gShape === 'square') {
          ctx.strokeRect(gx - gr, gy - gr*0.8, gr*2, gr*1.6);
        } else {
          // Cat eye
          ctx.beginPath();
          ctx.moveTo(gx - gr, gy);
          ctx.quadraticCurveTo(gx - gr, gy - gr*1.2, gx, gy - gr*0.8);
          ctx.quadraticCurveTo(gx + gr, gy - gr*1.2, gx + gr, gy);
          ctx.quadraticCurveTo(gx + gr*0.8, gy + gr*0.8, gx, gy + gr*0.6);
          ctx.quadraticCurveTo(gx - gr*0.8, gy + gr*0.8, gx - gr, gy);
          ctx.stroke();
        }
      }
      // Bridge
      ctx.beginPath(); ctx.moveTo(head.x - gSpread + gr, gy); ctx.lineTo(head.x + gSpread - gr, gy); ctx.stroke();
      // Arms
      ctx.beginPath(); ctx.moveTo(head.x - gSpread - gr, gy); ctx.lineTo(head.x - headR*0.85, gy + 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(head.x + gSpread + gr, gy); ctx.lineTo(head.x + headR*0.85, gy + 5); ctx.stroke();
      break;
    }
    case 'bowtie': {
      const by = head.y + headR * 0.85;
      const bc = pick(['#e74c3c','#1a237e','#4caf50','#f39c12','#9b59b6','#e91e63']);
      ctx.fillStyle = bc;
      ctx.beginPath(); ctx.ellipse(head.x - headR*0.25, by, headR*0.22, headR*0.13, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(head.x + headR*0.25, by, headR*0.22, headR*0.13, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = adj(bc, -30);
      ctx.beginPath(); ctx.arc(head.x, by, headR*0.07, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'scarf': {
      const sy = head.y + headR * 0.65;
      const sc = pick(['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#e91e63','#1abc9c']);
      ctx.fillStyle = sc;
      ctx.beginPath(); ctx.ellipse(head.x, sy, headR*0.85, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = adj(sc, -20); ctx.lineWidth = 1.5; ctx.stroke();
      // Dangling end
      ctx.fillStyle = adj(sc, -10);
      ctx.beginPath();
      ctx.moveTo(head.x + headR*0.4, sy + headR*0.15);
      ctx.quadraticCurveTo(head.x + headR*0.6, sy + headR*0.5, head.x + headR*0.35, sy + headR*0.65);
      ctx.lineTo(head.x + headR*0.15, sy + headR*0.5);
      ctx.closePath(); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

// ===================================================================
// MAIN GENERATE
// ===================================================================

const HATS = ['tophat','crown','beret','partyHat','cowboyHat','wizardHat','beanie','bow','flower','tiara'];
const JEWELRY = ['necklace','earring','glasses','bowtie','scarf'];
const SITUATIONS = ['apple','teacup','mushroom','book','flowerpot','rock','jar','none','none'];
const EYE_STYLES = ['big','big','round','sleepy','dot','sparkle','wink','hearts','uwu'];
const MOUTH_STYLES = ['smile','bigSmile','open','blep','tiny','o','cat','smirk'];
const PATTERNS = ['none','none','none','none','segments','spots','stripes'];

function generate() {
  const seed = Date.now() ^ (Math.random() * 0xFFFFFFFF);
  rng = mulberry32(seed);
  ctx.clearRect(0, 0, S, S);

  // White/soft background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, S, S);

  const pal = pick(PALS);
  const thickness = rand(55, 85);
  const pattern = pick(PATTERNS);
  const eyeStyle = pick(EYE_STYLES);
  const mouthStyle = pick(MOUTH_STYLES);
  const situation = pick(SITUATIONS);
  const hat = chance(0.75) ? pick(HATS) : null;
  const jewel1 = chance(0.5) ? pick(JEWELRY) : null;
  const jewel2 = (jewel1 && chance(0.3)) ? pick(JEWELRY.filter(j => j !== jewel1)) : null;
  const rosyCheeks = chance(0.5);

  // Generate body path
  const bodyPts = generateWorm();

  // Draw situation BEHIND worm (some props)
  const situationBehind = ['rock','mushroom','book'];
  if (situationBehind.includes(situation)) {
    drawSituation(situation, bodyPts[0], bodyPts, thickness);
  }

  // Draw worm body
  drawWormBody(bodyPts, pal, thickness, pattern);

  // Draw face on head
  drawFace(bodyPts[0], thickness, pal, eyeStyle, mouthStyle, { rosyCheeks });

  // Draw situation IN FRONT of worm (cups, pots, etc)
  if (!situationBehind.includes(situation)) {
    drawSituation(situation, bodyPts[0], bodyPts, thickness);
  }

  // Jewelry (under hat)
  if (jewel1) drawJewelry(bodyPts[0], thickness, jewel1);
  if (jewel2) drawJewelry(bodyPts[0], thickness, jewel2);

  // Hat
  if (hat) drawHat(bodyPts[0], thickness, hat);

  document.getElementById('wormName').textContent = pick(FIRST) + ' ' + pick(LAST);
}

generate();
document.getElementById('btnNew').addEventListener('click', generate);
document.getElementById('btnSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = document.getElementById('wormName').textContent.replace(/\s+/g,'_') + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
